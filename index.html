<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>نظام البطاقات</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
:root{--bg:#070d1a;--surface:#0f1c2e;--surface2:#162236;--border:#1d3557;--accent:#00c8ff;--accent2:#0051d4;--success:#00e676;--warning:#ffc107;--error:#ff4569;--text:#e2eeff;--muted:#6b87aa;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;}

header{position:sticky;top:0;z-index:50;background:rgba(7,13,26,.96);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;}
.logo{display:flex;align-items:center;gap:10px;}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent2),var(--accent));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;}
.logo-text{font-size:16px;font-weight:700;line-height:1.2;}
.logo-text span{color:var(--accent);}
.logo-sub{font-size:10px;color:var(--muted);}
.hdr-stats{display:flex;gap:14px;}
.hdr-stat{text-align:center;}
.hdr-num{font-size:17px;font-weight:700;color:var(--accent);line-height:1;}
.hdr-lbl{font-size:9px;color:var(--muted);}

main{padding:16px;max-width:700px;margin:0 auto;}
section{margin-bottom:20px;}

.upload-zone{border:2px dashed var(--border);border-radius:20px;padding:36px 20px;text-align:center;background:var(--surface);transition:all .25s;cursor:pointer;}
.upload-zone.drag-over{border-color:var(--accent);background:rgba(0,200,255,.06);}
.upload-icon{font-size:44px;margin-bottom:10px;}
.upload-title{font-size:18px;font-weight:700;margin-bottom:6px;}
.upload-sub{color:var(--muted);font-size:13px;margin-bottom:20px;line-height:1.6;}
.upload-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}

.btn{padding:11px 20px;border-radius:10px;border:none;font-family:'Cairo',sans-serif;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:7px;touch-action:manipulation;user-select:none;}
.btn:active{transform:scale(.97);}
.btn-blue{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;}
.btn-dark{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-dark:hover{border-color:var(--accent);color:var(--accent);}
.btn-green{background:linear-gradient(135deg,#008f40,var(--success));color:#fff;font-size:16px;font-weight:700;padding:15px 40px;width:100%;justify-content:center;border-radius:14px;}
.btn-green:hover{box-shadow:0 8px 24px rgba(0,230,118,.3);}
.btn-green:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none;}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--error);color:var(--error);}
.btn-new{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;padding:13px 32px;border-radius:12px;}
.btn-retry-inline{background:rgba(0,200,255,.12);color:var(--accent);border:1px solid rgba(0,200,255,.25);padding:4px 10px;font-size:11px;border-radius:8px;font-family:'Cairo',sans-serif;cursor:pointer;font-weight:600;}
.btn-retry-inline:hover{background:rgba(0,200,255,.22);}

.preview-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.preview-bar-title{font-size:14px;font-weight:700;}
.preview-bar-actions{display:flex;gap:8px;align-items:center;}
.count-badge{background:var(--accent);color:var(--bg);padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700;}
.preview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
@media(max-width:400px){.preview-grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));}}

.pv-item{position:relative;border-radius:12px;overflow:hidden;border:2px solid var(--border);background:var(--surface2);aspect-ratio:1.6;transition:border-color .2s;cursor:pointer;}
.pv-item:hover{border-color:rgba(0,200,255,.4);}
.pv-item.s-ok{border-color:var(--success);}
.pv-item.s-dup{border-color:var(--warning);}
.pv-item.s-partial{border-color:var(--accent2);}
.pv-item.s-err{border-color:var(--error);}
.pv-item img{width:100%;height:100%;object-fit:cover;display:block;}
.pv-del{position:absolute;top:5px;left:5px;background:rgba(255,69,105,.85);border:none;color:#fff;width:22px;height:22px;border-radius:50%;font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;z-index:2;}
.pv-item:hover .pv-del,.pv-item:active .pv-del{opacity:1;}
.pv-name{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8));padding:12px 6px 4px;font-size:10px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pv-badge{position:absolute;top:5px;right:5px;padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700;}
.pb-wait{background:rgba(255,193,7,.9);color:#000;}
.pb-proc{background:rgba(0,200,255,.9);color:#000;}
.pb-ok{background:rgba(0,230,118,.9);color:#000;}
.pb-dup{background:rgba(255,193,7,.9);color:#000;}
.pb-partial{background:rgba(0,81,212,.9);color:#fff;}
.pb-err{background:rgba(255,69,105,.9);color:#fff;}
/* زر retry صغير على الصورة */
.pv-retry-btn{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);background:rgba(0,200,255,.9);border:none;color:#000;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;cursor:pointer;font-family:'Cairo',sans-serif;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:2;}
.pv-item.s-err:hover .pv-retry-btn,.pv-item.s-err:active .pv-retry-btn{opacity:1;}

.progress-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;}
.prog-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.prog-title{font-size:14px;font-weight:700;}
.prog-pct{font-size:20px;font-weight:900;color:var(--accent);}
.prog-wrap{background:var(--surface2);border-radius:8px;height:10px;overflow:hidden;margin-bottom:10px;}
.prog-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:8px;transition:width .4s ease;position:relative;overflow:hidden;}
.prog-bar::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);animation:sh 1.5s infinite;}
@keyframes sh{0%{transform:translateX(-100%)}100%{transform:translateX(200%)}}
.prog-detail{font-size:12px;color:var(--muted);}

.result-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px;}
.rs-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 10px;text-align:center;}
.rs-card.ok{border-color:rgba(0,230,118,.4);}
.rs-card.dup{border-color:rgba(255,193,7,.4);}
.rs-card.part{border-color:rgba(0,81,212,.4);}
.rs-card.err{border-color:rgba(255,69,105,.4);}
.rs-icon{font-size:20px;margin-bottom:4px;}
.rs-num{font-size:22px;font-weight:900;}
.rs-lbl{font-size:10px;color:var(--muted);}
.rs-card.ok .rs-num{color:var(--success);}
.rs-card.dup .rs-num{color:var(--warning);}
.rs-card.part .rs-num{color:#66aaff;}
.rs-card.err .rs-num{color:var(--error);}

.table-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px;}
.table-hdr{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px;}
.table-title{font-size:14px;font-weight:700;}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;}
table{width:100%;border-collapse:collapse;min-width:500px;}
th{padding:10px 12px;text-align:right;font-size:11px;color:var(--muted);font-weight:600;background:var(--surface2);border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 12px;font-size:12px;border-bottom:1px solid rgba(29,53,87,.5);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(0,200,255,.02);}
.badge{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;}
.b-ok{background:rgba(0,230,118,.12);color:var(--success);}
.b-dup{background:rgba(255,193,7,.12);color:var(--warning);}
.b-part{background:rgba(0,81,212,.15);color:#66aaff;}
.b-err{background:rgba(255,69,105,.12);color:var(--error);}

/* ===== LIGHTBOX ===== */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .25s;}
.lb.open{opacity:1;pointer-events:all;}
.lb-img-wrap{max-width:100%;max-height:65vh;display:flex;align-items:center;justify-content:center;}
.lb-img{max-width:100%;max-height:65vh;border-radius:12px;object-fit:contain;box-shadow:0 20px 60px rgba(0,0,0,.8);}
.lb-info{margin-top:14px;text-align:center;width:100%;}
.lb-fname{font-size:13px;font-weight:700;margin-bottom:4px;}
.lb-status{font-size:12px;color:var(--muted);margin-bottom:14px;}
.lb-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
.lb-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.1);border:none;color:#fff;width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
.lb-close:hover{background:rgba(255,69,105,.4);}

.notif{position:fixed;bottom:20px;right:50%;transform:translateX(50%) translateY(120px);background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 20px;font-size:13px;font-weight:600;z-index:300;transition:transform .3s ease;box-shadow:0 16px 48px rgba(0,0,0,.5);max-width:calc(100vw - 32px);text-align:center;}
.notif.show{transform:translateX(50%) translateY(0);}
.notif.ok{border-color:var(--success);}
.notif.err{border-color:var(--error);}
.notif.warn{border-color:var(--warning);}

.hidden{display:none !important;}
#fileIn,#camIn{display:none;}
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🪪</div>
    <div>
      <div class="logo-text">نظام <span>البطاقات</span></div>
      <div class="logo-sub">معالجة بطاقات الرقم القومي</div>
    </div>
  </div>
  <div class="hdr-stats">
    <div class="hdr-stat"><div class="hdr-num" id="h0">0</div><div class="hdr-lbl">إجمالي</div></div>
    <div class="hdr-stat"><div class="hdr-num" style="color:var(--success)" id="h1">0</div><div class="hdr-lbl">تمت</div></div>
    <div class="hdr-stat"><div class="hdr-num" style="color:var(--warning)" id="h2">0</div><div class="hdr-lbl">مكرر</div></div>
    <div class="hdr-stat"><div class="hdr-num" style="color:var(--error)" id="h3">0</div><div class="hdr-lbl">فشل</div></div>
  </div>
</header>

<main>
  <section id="secUpload">
    <div class="upload-zone" id="dropZone">
      <div class="upload-icon">📁</div>
      <div class="upload-title">ارفع صور البطاقات</div>
      <div class="upload-sub">اسحب وأفلت هنا أو اختر من هاتفك</div>
      <div class="upload-btns">
        <button class="btn btn-blue" onclick="document.getElementById('fileIn').click()">🖼️ اختر صور</button>
        <button class="btn btn-dark" onclick="document.getElementById('camIn').click()">📷 كاميرا</button>
      </div>
    </div>
    <input type="file" id="fileIn" multiple accept="image/*" onchange="addFiles(this.files);this.value=''">
    <input type="file" id="camIn" accept="image/*" capture="environment" onchange="addFiles(this.files);this.value=''">
  </section>

  <section id="secPreview" class="hidden">
    <div class="preview-bar">
      <div class="preview-bar-title">📸 الصور المختارة</div>
      <div class="preview-bar-actions">
        <span class="count-badge" id="cntBadge">0</span>
        <button class="btn btn-dark btn-sm" onclick="document.getElementById('fileIn').click()">➕ إضافة</button>
        <button class="btn btn-ghost btn-sm" onclick="clearAll()">🗑️</button>
      </div>
    </div>
    <div class="preview-grid" id="pvGrid"></div>
  </section>

  <section id="secGo" class="hidden">
    <button class="btn btn-green" id="goBtn" onclick="startProcessing()">🚀 بدء المعالجة</button>
  </section>

  <section id="secProg" class="hidden">
    <div class="progress-card">
      <div class="prog-header">
        <div class="prog-title">⚡ جاري المعالجة...</div>
        <div class="prog-pct" id="pct">0%</div>
      </div>
      <div class="prog-wrap"><div class="prog-bar" id="pBar"></div></div>
      <div class="prog-detail" id="pDetail">جاري التهيئة...</div>
    </div>
  </section>

  <section id="secResults" class="hidden">
    <div class="result-stats">
      <div class="rs-card ok"><div class="rs-icon">✅</div><div class="rs-num" id="r0">0</div><div class="rs-lbl">تمت</div></div>
      <div class="rs-card dup"><div class="rs-icon">🔁</div><div class="rs-num" id="r1">0</div><div class="rs-lbl">مكرر</div></div>
      <div class="rs-card part"><div class="rs-icon">⚠️</div><div class="rs-num" id="r2">0</div><div class="rs-lbl">جزئي</div></div>
      <div class="rs-card err"><div class="rs-icon">❌</div><div class="rs-num" id="r3">0</div><div class="rs-lbl">فشل</div></div>
    </div>
    <div class="table-card">
      <div class="table-hdr">
        <div class="table-title">📊 تفاصيل النتائج</div>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-dark btn-sm" onclick="expCSV()">📥 CSV</button>
          <button class="btn btn-dark btn-sm" onclick="expXLS()">📊 Excel</button>
        </div>
      </div>
      <div class="tbl-wrap">
        <table>
          <thead><tr><th>#</th><th>الاسم</th><th>الرقم القومي</th><th>الهاتف</th><th>أفراد</th><th>الحالة</th><th></th></tr></thead>
          <tbody id="tBody"></tbody>
        </table>
      </div>
    </div>
    <div style="text-align:center">
      <button class="btn btn-new" onclick="resetAll()">🔄 دفعة جديدة</button>
    </div>
  </section>
</main>

<!-- LIGHTBOX -->
<div class="lb" id="lb" onclick="lbBgClick(event)">
  <button class="lb-close" onclick="closeLB()">✕</button>
  <div class="lb-img-wrap">
    <img class="lb-img" id="lbImg" src="" alt="">
  </div>
  <div class="lb-info">
    <div class="lb-fname" id="lbFname"></div>
    <div class="lb-status" id="lbSt"></div>
    <div class="lb-actions" id="lbActs"></div>
  </div>
</div>

<div class="notif" id="notif"></div>

<script>
const N8N = 'https://n8n.srv855524.hstgr.cloud/webhook/batakat-ocr';

let files = [];   // [{file, id, status, data}]
let processing = false;

// ───── Drag & Drop ─────
const dz = document.getElementById('dropZone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drag-over'); addFiles(e.dataTransfer.files); });

function addFiles(fs) {
  for (const f of fs) if (f.type.startsWith('image/')) files.push({ file: f, id: Math.random(), status: 'wait', data: null });
  render();
}
function removeFile(i) { if (!processing) { files.splice(i, 1); render(); } }
function clearAll()    { if (!processing) { files = []; render(); } }

// ───── Render ─────
const STATUS_MAP = {
  wait:      ['pb-wait',    'انتظار',  ''],
  proc:      ['pb-proc',    'جاري...', ''],
  success:   ['pb-ok',      '✓ تمت',   's-ok'],
  partial:   ['pb-partial', '⚠️ جزئي', 's-partial'],
  duplicate: ['pb-dup',     'مكرر',    's-dup'],
  error:     ['pb-err',     'فشل',     's-err'],
};

function render() {
  const has = files.length > 0;
  tog('secPreview', has); tog('secGo', has);
  document.getElementById('cntBadge').textContent = files.length;

  document.getElementById('pvGrid').innerHTML = files.map((f, i) => {
    const url = URL.createObjectURL(f.file);
    const [bcls, btxt, icls] = STATUS_MAP[f.status] || STATUS_MAP.wait;
    const retryBtn = f.status === 'error'
      ? `<button class="pv-retry-btn" onclick="retrySingle(${i},event)">🔄 إعادة</button>`
      : '';
    return `<div class="pv-item ${icls}" onclick="openLB(${i})">
      <img src="${url}" loading="lazy">
      <button class="pv-del" onclick="removeFile(${i});event.stopPropagation()">✕</button>
      <div class="pv-name">${f.file.name}</div>
      <div class="pv-badge ${bcls}">${btxt}</div>
      ${retryBtn}
    </div>`;
  }).join('');
}

// ───── Lightbox ─────
function openLB(i) {
  const f = files[i];
  document.getElementById('lbImg').src = URL.createObjectURL(f.file);
  document.getElementById('lbFname').textContent = f.file.name;
  const stTxt = { wait:'انتظار', proc:'جاري...', success:'✅ تمت الإضافة', partial:'⚠️ تمت الإضافة (جزئي)', duplicate:'🔁 مكرر', error:'❌ فشل الاستخراج' };
  document.getElementById('lbSt').textContent = stTxt[f.status] || '';
  const acts = document.getElementById('lbActs');
  acts.innerHTML = f.status === 'error'
    ? `<button class="btn btn-blue btn-sm" onclick="closeLB();retrySingle(${i},null)">🔄 إعادة المحاولة</button>`
    : '';
  document.getElementById('lb').classList.add('open');
}
function closeLB() { document.getElementById('lb').classList.remove('open'); }
function lbBgClick(e) { if (e.target === document.getElementById('lb')) closeLB(); }

// ───── Retry Single ─────
async function retrySingle(i, e) {
  if (e) e.stopPropagation();
  if (processing) return notify('انتظر انتهاء المعالجة', 'warn');
  await processFile(i);
  renderStats();
  renderTable();
  show('secResults');
}

// ───── Core: process one file ─────
async function processFile(i) {
  const f = files[i];
  f.status = 'proc';
  render();
  try {
    const b64  = await toB64(f.file);
    const mime = f.file.type || 'image/jpeg';
    const res  = await fetch(N8N, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ image: b64, mimeType: mime, fileName: f.file.name })
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    f.status = data.status || 'error';
    f.data   = data;
  } catch(err) {
    f.status = 'error';
    f.data   = { status: 'error', message: err.message, name: null, national_id: null, phone: null, family_count: null, unclear_fields: [] };
  }
  render();
}

// ───── Main Processing ─────
async function startProcessing() {
  if (!files.length || processing) return;
  processing = true;
  document.getElementById('goBtn').disabled = true;
  show('secProg'); hide('secResults');

  const pending = files.filter(f => f.status === 'wait' || f.status === 'error');

  for (let j = 0; j < pending.length; j++) {
    const i = files.indexOf(pending[j]);
    setProgress(j, pending.length, `(${j+1}/${pending.length}) ${pending[j].file.name}`);
    await processFile(i);
    renderStats();
    updHdr();
    if (j < pending.length - 1) await sleep(500);
  }

  setProgress(pending.length, pending.length, '✅ اكتملت المعالجة!');
  renderTable();
  show('secResults');
  processing = false;
  document.getElementById('goBtn').disabled = false;

  const s = calcStats();
  notify(`✅ ${s.ok} تمت  |  🔁 ${s.dup} مكرر  |  ❌ ${s.fail} فشل`, 'ok');
}

// ───── Stats ─────
function calcStats() {
  let ok=0, dup=0, partial=0, fail=0;
  files.forEach(f => {
    if      (f.status === 'success')   ok++;
    else if (f.status === 'partial')   { ok++; partial++; }
    else if (f.status === 'duplicate') dup++;
    else if (f.status === 'error')     fail++;
  });
  return { total: files.length, ok, dup, partial, fail };
}
function renderStats() {
  const s = calcStats();
  document.getElementById('r0').textContent = s.ok;
  document.getElementById('r1').textContent = s.dup;
  document.getElementById('r2').textContent = s.partial;
  document.getElementById('r3').textContent = s.fail;
  updHdr();
}
function updHdr() {
  const s = calcStats();
  document.getElementById('h0').textContent = s.total;
  document.getElementById('h1').textContent = s.ok;
  document.getElementById('h2').textContent = s.dup;
  document.getElementById('h3').textContent = s.fail;
}

// ───── Table ─────
const BADGE = {
  success:   '<span class="badge b-ok">✅ تمت</span>',
  partial:   '<span class="badge b-part">⚠️ جزئي</span>',
  duplicate: '<span class="badge b-dup">🔁 مكرر</span>',
  error:     '<span class="badge b-err">❌ فشل</span>',
};
function renderTable() {
  renderStats();
  const rows = files.map((f, i) => {
    const d = f.data || {};
    const retryCell = f.status === 'error'
      ? `<button class="btn-retry-inline" onclick="retrySingle(${i},event)">🔄 إعادة</button>`
      : '';
    return `<tr>
      <td style="color:var(--muted);cursor:pointer" onclick="openLB(${i})">${i+1}</td>
      <td>${d.name||'—'}</td>
      <td style="font-family:monospace;font-size:11px">${d.national_id||'—'}</td>
      <td>${d.phone||'—'}</td>
      <td style="text-align:center">${d.family_count??'—'}</td>
      <td>${BADGE[f.status]||BADGE.error}</td>
      <td>${retryCell}</td>
    </tr>`;
  }).filter(Boolean);
  document.getElementById('tBody').innerHTML = rows.join('') || `<tr><td colspan="7" style="text-align:center;color:var(--muted);padding:24px">لا توجد نتائج</td></tr>`;
}

// ───── Helpers ─────
function toB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result.split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function setProgress(done, total, detail) {
  const p = total ? Math.round(done / total * 100) : 0;
  document.getElementById('pBar').style.width = p + '%';
  document.getElementById('pct').textContent  = p + '%';
  document.getElementById('pDetail').textContent = detail;
}
function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function tog(id, v) { document.getElementById(id).classList.toggle('hidden', !v); }
function notify(msg, type='ok') {
  const el = document.getElementById('notif');
  el.textContent = msg; el.className = `notif show ${type}`;
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 3500);
}

// ───── Export ─────
function expCSV() {
  const h = ['#','الاسم','الرقم القومي','الهاتف','أفراد الأسرة','الحالة','ملاحظات'];
  const rows = files.map((f, i) => {
    const d = f.data || {};
    const notes = d.unclear_fields?.length ? 'غير واضح: ' + d.unclear_fields.join('، ') : (d.message || '');
    return [i+1, d.name||'', d.national_id||'', d.phone||'', d.family_count||'', f.status, notes];
  });
  dl('\ufeff' + [h, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'), 'تقرير_البطاقات.csv', 'text/csv;charset=utf-8');
}
function expXLS() {
  const rows = files.map((f, i) => {
    const d = f.data || {};
    return `<tr><td>${i+1}</td><td>${d.name||''}</td><td>${d.national_id||''}</td><td>${d.phone||''}</td><td>${d.family_count||''}</td><td>${f.status}</td></tr>`;
  }).join('');
  dl('\ufeff<table><tr><th>#</th><th>الاسم</th><th>الرقم القومي</th><th>الهاتف</th><th>أفراد</th><th>الحالة</th></tr>' + rows + '</table>', 'تقرير_البطاقات.xls', 'application/vnd.ms-excel;charset=utf-8');
}
function dl(content, name, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; a.click();
}

function resetAll() {
  if (processing) return;
  files = [];
  ['secPreview','secGo','secProg','secResults'].forEach(hide);
  show('secUpload');
  document.getElementById('goBtn').disabled = false;
  document.getElementById('pBar').style.width = '0%';
  ['h0','h1','h2','h3'].forEach(id => document.getElementById(id).textContent = '0');
}
</script>
